name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip, curl, fileinfo
          coverage: none

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Setup SSH & Deploy via Rsync to cPanel
        env:
          SSH_KEY: ${{ secrets.ssh_key || secrets.SSH_KEY }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || secrets.SSH_TARGET_DIR || 'public_html' }}
        run: |
          set -e

          echo "🔐 Preparing SSH Configuration..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Validate required secrets
          if [ -z "$SSH_HOST" ]; then
            echo "❌ Error: SSH_HOST secret is missing in GitHub Repository Secrets!"
            exit 1
          fi
          if [ -z "$SSH_USER" ]; then
            echo "❌ Error: SSH_USER (or SSH_USERNAME) secret is missing in GitHub Repository Secrets!"
            exit 1
          fi

          # Install sshpass
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y sshpass rsync >/dev/null 2>&1 || true

          # Base SSH options
          SSH_OPTS="-p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o BatchMode=yes"

          # Setup private key if supplied
          HAS_KEY=false
          if [ -n "$SSH_KEY" ]; then
            echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            HAS_KEY=true
          fi

          # Function to test connectivity
          CONNECTED=false
          SELECTED_SSH_CMD=""

          # Attempt 1: SSH Key Authentication
          if [ "$HAS_KEY" = "true" ]; then
            echo "🔑 Testing SSH Key authentication..."
            if ssh $SSH_OPTS -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "echo 'SSH_KEY_OK'" >/dev/null 2>&1; then
              echo "✅ SSH Key Authentication Successful!"
              SELECTED_SSH_CMD="ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa"
              CONNECTED=true
            else
              echo "⚠️ SSH Key authentication was not accepted by cPanel."
            fi
          fi

          # Attempt 2: SSH Password Authentication (if key failed or password provided)
          if [ "$CONNECTED" = "false" ] && [ -n "$SSH_PASS" ]; then
            echo "🔑 Testing SSH Password authentication..."
            PASS_OPTS="-p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15"
            if sshpass -p "$SSH_PASS" ssh $PASS_OPTS "$SSH_USER@$SSH_HOST" "echo 'SSH_PASS_OK'" >/dev/null 2>&1; then
              echo "✅ SSH Password Authentication Successful!"
              SELECTED_SSH_CMD="sshpass -p '$SSH_PASS' ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
              CONNECTED=true
            else
              echo "⚠️ SSH Password authentication was not accepted by cPanel."
            fi
          fi

          if [ "$CONNECTED" = "false" ]; then
            echo "❌ Authentication Failed! cPanel rejected both SSH Key and Password."
            echo ""
            echo "📋 Please verify the following in your cPanel and GitHub Secrets:"
            echo "1. cPanel -> SSH Access -> Manage SSH Keys -> Ensure your key is 'Authorized' (click Manage -> Authorize)."
            echo "2. GitHub Secrets -> 'SSH_USER': Ensure it matches your exact cPanel username."
            echo "3. GitHub Secrets -> 'SSH_HOST': Ensure it is your server IP or domain (without https://)."
            echo "4. GitHub Secrets -> 'SSH_PORT': If your hosting uses a custom SSH port (e.g. 21098 or 2222), specify it in SSH_PORT."
            echo "5. GitHub Secrets -> 'ssh_key': Ensure you pasted the Private Key (BEGIN ... PRIVATE KEY)."
            echo "6. GitHub Secrets -> 'SSH_PASSWORD': Ensure it is your exact cPanel password."
            exit 1
          fi

          echo "📁 Current remote directory check:"
          $SELECTED_SSH_CMD "$SSH_USER@$SSH_HOST" "pwd && ls -ld $DEPLOY_PATH 2>/dev/null || true"

          # Exclude non-production / sensitive files from sync
          cat << 'EOF' > .rsync-exclude
          .git/
          .github/
          .env
          .env.*
          node_modules/
          tests/
          .phpunit.result.cache
          phpunit.xml
          .editorconfig
          .rsync-exclude
          EOF

          echo "🚀 Synchronizing application files via Rsync to $DEPLOY_PATH ..."
          rsync -avz --delete \
            -e "$SELECTED_SSH_CMD" \
            --exclude-from='.rsync-exclude' \
            --exclude='storage/app/public/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/logs/*' \
            --exclude='public/uploads/*' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

          echo "⚙️ Executing Artisan commands on cPanel..."
          $SELECTED_SSH_CMD "$SSH_USER@$SSH_HOST" "
            set -e
            cd $DEPLOY_PATH

            # Ensure storage directories exist with correct permissions
            mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            # Run artisan optimization and migrations
            if [ -f 'artisan' ]; then
              php artisan storage:link --quiet || true
              php artisan migrate --force || true
              php artisan optimize:clear || true
              php artisan config:cache || true
              php artisan route:cache || true
              php artisan view:cache || true
            fi
          "

          echo "🎉 Deployment finished successfully!"
