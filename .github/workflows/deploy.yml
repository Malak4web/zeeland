name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip, curl, fileinfo
          coverage: none

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Setup SSH & Deploy via Rsync to cPanel
        env:
          SSH_KEY: ${{ secrets.ssh_key || secrets.SSH_KEY }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || secrets.SSH_TARGET_DIR || 'public_html' }}
        run: |
          set -e

          echo "🔐 Preparing SSH Configuration..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Validate secrets
          if [ -z "$SSH_HOST" ]; then
            echo "❌ Error: SSH_HOST secret is missing in GitHub Repository Secrets!"
            exit 1
          fi
          if [ -z "$SSH_USER" ]; then
            echo "❌ Error: SSH_USER (or SSH_USERNAME) secret is missing in GitHub Repository Secrets!"
            exit 1
          fi

          # Prepare SSH Key
          USE_KEY=false
          if [ -n "$SSH_KEY" ]; then
            echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa_raw
            chmod 600 ~/.ssh/id_rsa_raw

            # If key has a passphrase, decrypt it in the runner so SSH never prompts
            if [ -n "$SSH_PASS" ]; then
              openssl rsa -in ~/.ssh/id_rsa_raw -out ~/.ssh/id_rsa -passin pass:"$SSH_PASS" 2>/dev/null || cp ~/.ssh/id_rsa_raw ~/.ssh/id_rsa
            else
              cp ~/.ssh/id_rsa_raw ~/.ssh/id_rsa
            fi
            chmod 600 ~/.ssh/id_rsa
            USE_KEY=true
          fi

          # Register Host Key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Build SSH Command with strict timeouts to prevent hanging
          SSH_OPTS="-p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"

          if [ "$USE_KEY" = "true" ]; then
            SSH_CMD="ssh $SSH_OPTS -i ~/.ssh/id_rsa"
          elif [ -n "$SSH_PASS" ]; then
            sudo apt-get install -y sshpass
            SSH_CMD="sshpass -p '$SSH_PASS' ssh $SSH_OPTS"
          else
            echo "❌ Error: Neither ssh_key nor SSH_PASSWORD is provided in GitHub Secrets!"
            exit 1
          fi

          echo "🔍 Testing SSH connection to $SSH_USER@$SSH_HOST:$SSH_PORT ..."
          $SSH_CMD "$SSH_USER@$SSH_HOST" "echo '✅ SSH Connection Successful to cPanel! Current directory: \$(pwd)'"

          # Exclude non-production / sensitive files from sync
          cat << 'EOF' > .rsync-exclude
          .git/
          .github/
          .env
          .env.*
          node_modules/
          tests/
          .phpunit.result.cache
          phpunit.xml
          .editorconfig
          .rsync-exclude
          EOF

          echo "🚀 Synchronizing files via Rsync to $DEPLOY_PATH ..."
          rsync -avz --delete \
            -e "$SSH_CMD" \
            --exclude-from='.rsync-exclude' \
            --exclude='storage/app/public/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/logs/*' \
            --exclude='public/uploads/*' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

          echo "⚙️ Executing Artisan commands on cPanel..."
          $SSH_CMD "$SSH_USER@$SSH_HOST" "
            set -e
            cd $DEPLOY_PATH

            # Ensure storage directories exist with correct permissions
            mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            # Run artisan optimization and migrations
            if [ -f 'artisan' ]; then
              php artisan storage:link --quiet || true
              php artisan migrate --force || true
              php artisan optimize:clear || true
              php artisan config:cache || true
              php artisan route:cache || true
              php artisan view:cache || true
            fi
          "

          echo "🎉 Deployment finished successfully!"
