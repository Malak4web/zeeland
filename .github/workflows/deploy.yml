name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_sqlite, sqlite3, bcmath, zip, curl, fileinfo
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Configure Composer & Git Authentication
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          composer config --global github-oauth.github.com "${{ secrets.GITHUB_TOKEN }}"
          composer config --global process-timeout 600

      - name: Install Composer Dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs || \
          composer install --no-dev --no-interaction --prefer-source --optimize-autoloader --ignore-platform-reqs

      - name: Build Database & Run Migrations with Seeders
        run: |
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Setup SSH & Deploy via Rsync to cPanel
        env:
          SSH_PASS: ${{ secrets.SSH_PASSWORD || secrets.SSH_PASS }}
          SSH_KEY: ${{ secrets.ssh_key || secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || secrets.SSH_TARGET_DIR || 'public_html' }}
        run: |
          set -e

          echo "🔐 Preparing SSH Configuration..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Validate required secrets
          if [ -z "$SSH_HOST" ]; then
            echo "❌ Error: SSH_HOST secret is missing in GitHub Repository Secrets!"
            exit 1
          fi
          if [ -z "$SSH_USER" ]; then
            echo "❌ Error: SSH_USER (or SSH_USERNAME) secret is missing in GitHub Repository Secrets!"
            exit 1
          fi
          if [ -z "$SSH_PASS" ] && [ -z "$SSH_KEY" ]; then
            echo "❌ Error: SSH_PASSWORD secret is missing in GitHub Repository Secrets!"
            exit 1
          fi

          # Install sshpass & rsync
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y sshpass rsync >/dev/null 2>&1 || true

          # Export password securely for sshpass
          export SSHPASS="$SSH_PASS"

          CONNECTED=false
          SELECTED_SSH_CMD=""

          # 1. Primary: SSH Password Authentication (sshpass)
          if [ -n "$SSH_PASS" ]; then
            echo "🔑 Testing SSH Password authentication on port $SSH_PORT..."
            PASS_OPTS="-p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15"
            if sshpass -e ssh $PASS_OPTS "$SSH_USER@$SSH_HOST" "echo 'SSH_PASS_OK'"; then
              echo "✅ SSH Password Authentication Successful on port $SSH_PORT!"
              SELECTED_SSH_CMD="sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
              CONNECTED=true
            else
              echo "⚠️ SSH Password authentication failed on port $SSH_PORT."
              # Try Hostinger port 65002 if 22 failed
              if [ "$SSH_PORT" = "22" ] || [ -z "$SSH_PORT" ]; then
                echo "🔄 Trying Hostinger default SSH port 65002..."
                HPASS_OPTS="-p 65002 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15"
                if sshpass -e ssh $HPASS_OPTS "$SSH_USER@$SSH_HOST" "echo 'SSH_PASS_OK'"; then
                  echo "✅ SSH Password Authentication Successful on port 65002 (Hostinger)!"
                  SELECTED_SSH_CMD="sshpass -e ssh -p 65002 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
                  CONNECTED=true
                fi
              fi
            fi
          fi

          # 2. Fallback: SSH Key Authentication (if password was not provided or failed)
          if [ "$CONNECTED" = "false" ] && [ -n "$SSH_KEY" ]; then
            echo "🔑 Testing SSH Key authentication fallback..."
            echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            KEY_OPTS="-p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes"
            if ssh $KEY_OPTS -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "echo 'SSH_KEY_OK'"; then
              echo "✅ SSH Key Authentication Successful!"
              SELECTED_SSH_CMD="ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa"
              CONNECTED=true
            fi
          fi

          if [ "$CONNECTED" = "false" ]; then
            echo "❌ Authentication Failed! Unable to connect to server via SSH."
            echo ""
            echo "📋 Please verify the following in Hostinger hPanel & GitHub Secrets:"
            echo "1. Hostinger hPanel -> Advanced -> 'SSH Access': Ensure SSH is ENABLED."
            echo "2. 'SSH_HOST': Your server IP or domain (e.g. 192.168.1.1 or connect.hostinger.com)"
            echo "3. 'SSH_USER': Your exact Hostinger/cPanel username (e.g. u469743545)"
            echo "4. 'SSH_PASSWORD': Your exact SSH / hosting account password"
            echo "5. 'SSH_PORT': For Hostinger, port is usually 65002 (default cPanel is 22)"
            echo "6. 'DEPLOY_PATH': Target path (e.g. domains/zad-dist.com/public_html or public_html)"
            exit 1
          fi

          echo "📁 Current remote directory check:"
          $SELECTED_SSH_CMD "$SSH_USER@$SSH_HOST" "pwd && ls -ld $DEPLOY_PATH 2>/dev/null || true"

          # Exclude non-production / build-only files from sync
          cat << 'EOF' > .rsync-exclude
          .git/
          .github/
          node_modules/
          tests/
          .phpunit.result.cache
          phpunit.xml
          .editorconfig
          .rsync-exclude
          database/*.sqlite-journal
          database/*.sqlite-wal
          database/*.sqlite-shm
          EOF

          echo "🚀 Synchronizing application files via Rsync to $DEPLOY_PATH ..."
          rsync -avz --delete \
            -e "$SELECTED_SSH_CMD" \
            --exclude-from='.rsync-exclude' \
            --exclude='storage/app/public/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/logs/*' \
            --exclude='public/uploads/*' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

          echo "⚙️ Executing Artisan commands on cPanel..."
          $SELECTED_SSH_CMD "$SSH_USER@$SSH_HOST" "
            set -e
            cd $DEPLOY_PATH

            # Detect the best PHP 8.4+ binary on the remote server
            PHP_BIN=\"php\"
            for candidate in \"/usr/bin/php8.4\" \"/usr/bin/php84\" \"/opt/alt/php84/usr/bin/php\" \"/usr/local/bin/ea-php84\" \"/usr/local/php84/bin/php\" \"/usr/local/bin/php84\" \"/usr/local/bin/php8.4\" \"php\"; do
              if command -v \"\$candidate\" >/dev/null 2>&1 || [ -x \"\$candidate\" ]; then
                VER=\$(\"\$candidate\" -r 'echo PHP_VERSION;' 2>/dev/null || true)
                if [ -n \"\$VER\" ]; then
                  echo \"🔎 Checked PHP: \$candidate (v\$VER)\"
                  IS_84=\$(\"\$candidate\" -r 'echo version_compare(PHP_VERSION, \"8.4.0\", \">=\") ? \"1\" : \"0\";' 2>/dev/null || echo \"0\")
                  if [ \"\$IS_84\" = \"1\" ]; then
                    PHP_BIN=\"\$candidate\"
                    echo \"✅ Selected PHP 8.4+ binary: \$PHP_BIN (v\$VER)\"
                    break
                  fi
                fi
              fi
            done

            echo \"🚀 Active CLI PHP: \$(\$PHP_BIN -v | head -n 1)\"

            # Ensure storage & database directories exist with correct permissions
            mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache database
            touch database/database.sqlite || true
            chmod -R 775 storage bootstrap/cache database
            chmod 664 database/database.sqlite || true

            # Run artisan optimization and migrations
            if [ -f 'artisan' ]; then
              \$PHP_BIN artisan storage:link --quiet || true
              \$PHP_BIN artisan migrate --force || true
              \$PHP_BIN artisan db:seed --force || true
              \$PHP_BIN artisan optimize:clear || true
              \$PHP_BIN artisan config:cache || true
              \$PHP_BIN artisan route:cache || true
              \$PHP_BIN artisan view:cache || true
            fi
          "

          echo "🎉 Deployment finished successfully!"
